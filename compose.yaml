services:
  agent-service:
    build:
      context: ./agent-service
    container_name: bob-agent-service
    environment:
      GATEWAY_URL: http://gateway:8080
      TEST_USER_TOKEN: test-user-token
      MOCK_SSO_EMAIL: miso@bob.local
      MOCK_SSO_PASSWORD: test-password
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - entry_net
      - control_net
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: ./gateway
    container_name: bob-mcp-gateway
    environment:
      FILE_MCP_URL: http://mock-mcp:9000
      OPA_DECISION_URL: http://opa:8181/v1/data/mcp/authz/allow
    networks:
      - control_net
      - mcp_net
    depends_on:
      mock-mcp:
        condition: service_healthy
      opa:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  opa:
    image: openpolicyagent/opa:1.17.0-static
    container_name: bob-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policy
    volumes:
      - ./policy:/policy:ro
      - ./tests/opa:/tests:ro
    networks:
      - control_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mock-mcp:
    build:
      context: ./mock-mcp
    container_name: bob-mock-mcp
    volumes:
      - ./fixtures:/data:ro
    networks:
      - mcp_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  entry_net:
    driver: bridge

  control_net:
    driver: bridge
    internal: true

  mcp_net:
    driver: bridge
    internal: true
